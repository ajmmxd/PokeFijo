<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poke Fijo - Catálogo</title>
<!-- Icono de la pestaña (Favicon) -->
<link id="favicon" rel="icon" type="image/png" href="">

<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; min-height: 100vh; }
  
  /* --- ESTILOS DEL ENCABEZADO Y LOGO --- */
  header {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-bottom: 30px;
  }
  #logo {
    max-height: 150px; 
    max-width: 100%;
    margin-bottom: 15px;
    object-fit: contain;
  }
  
  /* --- TÍTULO CON DEGRADADO --- */
  h1 { 
    text-align: center; 
    margin: 0; 
    font-size: 32px; 
    text-transform: uppercase;
    letter-spacing: 1px;
    
    /* Efecto degradado de azul a negro */
    background: linear-gradient(to right, #1e3c72, #2a5298, #000000);
    -webkit-background-clip: text; /* Para Chrome, Safari, Edge */
    background-clip: text;
    color: transparent; /* Hace que el texto sea transparente para ver el fondo */
    -webkit-text-fill-color: transparent; 
  }
  
  #grid { 
    display: grid; 
    grid-template-columns: repeat(4, 1fr); 
    gap: 20px; 
    max-width: 1200px; 
    margin: 0 auto; 
  }
  @media (max-width: 900px) { #grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 700px) { #grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 500px) { #grid { grid-template-columns: 1fr; } }
  
  .card { 
    background: white; 
    border-radius: 10px; 
    overflow: hidden; 
    box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
    display: flex; 
    flex-direction: column; 
    transition: transform 0.2s; 
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
  
  .img-container { 
    width: 100%; 
    height: 250px; 
    background-color: white; 
    border-left: 25px solid #eaeaea; 
    border-right: 25px solid #eaeaea; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    padding: 10px; 
  }
  
  .card img { 
    max-width: 100%; 
    max-height: 100%; 
    object-fit: contain; 
  }
  
  .info { padding: 15px; display: flex; flex-direction: column; gap: 8px; }
  .nombre { font-weight: bold; font-size: 14px; color: #333; line-height: 1.3; min-height: 36px; }
  .precio { font-size: 18px; font-weight: bold; color: #2e7d32; }
  .stock { font-size: 12px; color: #666; }
  .agotado { color: #d32f2f; font-weight: bold; }
</style>
</head>
<body>

<!-- ENCABEZADO CON LOGO Y TÍTULO -->
<header>
  <img id="logo" src="" alt="Logo Poke Fijo" style="display: none;">
  <h1>Catálogo de Productos</h1>
</header>

<div id="grid">Cargando productos...</div>

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbw2Z7uqtfy7QPoIAlD7FHLJfhjSh1uT_BGe8zpbfoKYxWjt7pa3Na3f_Anq_4l-cBQJ/exec";

// ID DE TU LOGO ACTUAL
const LOGO_ID = "1l9LZY_QYcSjNBC2MEOU49oEXkUkm5gKw"; 

const grid = document.getElementById("grid");
const logoImg = document.getElementById("logo");
const favicon = document.getElementById("favicon");

// --- LÓGICA PARA CARGAR EL LOGO Y EL FAVICON ---
if (LOGO_ID) {
  const logoUrl = "https://lh3.googleusercontent.com/d/" + LOGO_ID;
  
  // 1. Logo del encabezado
  logoImg.src = logoUrl;
  logoImg.style.display = "block"; 
  
  // 2. Logo de la pestaña (Favicon)
  favicon.href = logoUrl;
  
  // Respaldo por si falla lh3 en el logo principal
  logoImg.onerror = function() {
    this.onerror = null;
    this.src = "https://drive.google.com/thumbnail?id=" + LOGO_ID + "&sz=w500";
  };
}

// --- LÓGICA PARA CARGAR LOS PRODUCTOS ---
async function cargarProductos() {
  try {
    const respuesta = await fetch(SHEET_URL);
    const productos = await respuesta.json();
    grid.innerHTML = "";

    productos.forEach(fila => {
      const nombre = fila.Nombre || "Sin nombre";
      const precio = fila.Precio || "0";
      const stock = parseInt(fila.Stock) || 0;
      const imagenID = fila.ImagenID || "";

      const card = document.createElement("div");
      card.className = "card";
      const imgContainer = document.createElement("div");
      imgContainer.className = "img-container";
      const img = document.createElement("img");

      if (imagenID) {
        img.src = "https://lh3.googleusercontent.com/d/" + imagenID;
        
        img.onerror = function() {
          this.onerror = null; 
          this.src = "https://drive.google.com/thumbnail?id=" + imagenID + "&sz=w500";
          
          this.onerror = function() {
            this.style.display = "none";
            imgContainer.innerHTML = "<span style='color:#999;'>Imagen no disponible</span>";
          };
        };
      }
      
      img.alt = nombre;
      img.loading = "lazy";
      imgContainer.appendChild(img);

      const info = document.createElement("div");
      info.className = "info";
      const elNombre = document.createElement("div");
      elNombre.className = "nombre";
      elNombre.textContent = nombre;
      const elPrecio = document.createElement("div");
      elPrecio.className = "precio";
      elPrecio.textContent = "$" + precio;
      const elStock = document.createElement("div");
      elStock.className = "stock";
      if (stock > 0) { elStock.textContent = "Stock disponible: " + stock; } 
      else { elStock.textContent = "AGOTADO"; elStock.classList.add("agotado"); }

      info.appendChild(elNombre);
      info.appendChild(elPrecio);
      info.appendChild(elStock);
      card.appendChild(imgContainer);
      card.appendChild(info);
      grid.appendChild(card);
    });
  } catch (error) {
    console.error(error);
    grid.innerHTML = "<p style='text-align:center; color:red;'>Error al cargar los productos.</p>";
  }
}
cargarProductos();
</script>

</body>
</html>
